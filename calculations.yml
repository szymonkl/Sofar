alias: "SOFAR G13 - calculate targets"
id: sofar_g13_calculate_targets
mode: single

triggers:
  - trigger: time
    at: "20:30:00"
  - trigger: time
    at: "05:30:00"
  - trigger: time
    at: "12:30:00"
  - trigger: time
    at: "15:00:00"
  - trigger: time
    at: "18:00:00"

conditions:
  - condition: state
    entity_id: input_boolean.sofar_g13_enable
    state: "on"

actions:

  - action: recorder.get_statistics
    data:
      statistic_ids:
        - sensor.inverter_today_load_consumption
      start_time: "{{ today_at() - timedelta(days=7) }}"
      end_time: "{{ now() }}"
      period: hour
      types:
        - change
    response_variable: load_stats

  - action: forecast_solar.get_forecast
    data:
      config_entry: YOUR_FORECAST_SOLAR_CONFIG_ENTRY_ID
      start: "{{ today_at() }}"
      end: "{{ today_at() + timedelta(days=2) }}"
      resolution: hourly
    response_variable: solar_forecast

  - variables:

      battery_capacity_kwh: 20.48
      min_soc: 20
      max_soc: 90
      safety_factor: 1.15

      winter: "{{ now().month in [10,11,12,1,2,3] }}"

      peak_start: "{{ 16 if winter else 19 }}"
      peak_end: "{{ 21 if winter else 22 }}"

      rows: >
        {{ load_stats.statistics['sensor.inverter_today_load_consumption'] }}

      # P80 dla 07:00-13:00
      morning_values: >
        {% set ns = namespace(values=[]) %}

        {% for ago in range(1,8) %}
          {% set day = (today_at() - timedelta(days=ago)).date() %}
          {% set d = namespace(kwh=0) %}

          {% for r in rows %}
            {% set dt = as_datetime(r.start).astimezone() %}
            {% if dt.date() == day
                  and dt.hour >= 7
                  and dt.hour < 13 %}
              {% set d.kwh = d.kwh + (r.change | float(0)) %}
            {% endif %}
          {% endfor %}

          {% set ns.values = ns.values + [d.kwh] %}
        {% endfor %}

        {{ ns.values }}

      morning_p80: >
        {% set x = morning_values | sort %}
        {{ x[5] | float(0) if x | count >= 6 else 0 }}

      # P80 dla drogiego szczytu popołudniowego
      peak_values: >
        {% set ns = namespace(values=[]) %}

        {% for ago in range(1,8) %}
          {% set day = (today_at() - timedelta(days=ago)).date() %}
          {% set d = namespace(kwh=0) %}

          {% for r in rows %}
            {% set dt = as_datetime(r.start).astimezone() %}
            {% if dt.date() == day
                  and dt.hour >= peak_start | int
                  and dt.hour < peak_end | int %}
              {% set d.kwh = d.kwh + (r.change | float(0)) %}
            {% endif %}
          {% endfor %}

          {% set ns.values = ns.values + [d.kwh] %}
        {% endfor %}

        {{ ns.values }}

      peak_p80: >
        {% set x = peak_values | sort %}
        {{ x[5] | float(0) if x | count >= 6 else 0 }}

      # Jeśli jest wieczór/noc, cel 07:00 dotyczy jutra
      target_day: >
        {% if now().hour >= 13 %}
          {{ (today_at() + timedelta(days=1)).date() }}
        {% else %}
          {{ today_at().date() }}
        {% endif %}

      pv_morning_kwh: >
        {% set ns = namespace(wh=0) %}

        {% for timestamp, wh in solar_forecast.wh_period.items() %}
          {% set dt = as_datetime(timestamp).astimezone() %}

          {% if dt.date() | string == target_day | string
                and dt.hour >= 7
                and dt.hour < 13 %}
            {% set ns.wh = ns.wh + (wh | float(0)) %}
          {% endif %}
        {% endfor %}

        {{ ns.wh / 1000 }}

      pv_peak_kwh: >
        {% set ns = namespace(wh=0) %}

        {% for timestamp, wh in solar_forecast.wh_period.items() %}
          {% set dt = as_datetime(timestamp).astimezone() %}

          {% if dt.date() == now().date()
                and dt.hour >= peak_start | int
                and dt.hour < peak_end | int %}
            {% set ns.wh = ns.wh + (wh | float(0)) %}
          {% endif %}
        {% endfor %}

        {{ ns.wh / 1000 }}

      morning_deficit_kwh: >
        {{
          [
            (morning_p80 | float)
            - (pv_morning_kwh | float),
            0
          ] | max
        }}

      peak_deficit_kwh: >
        {{
          [
            (peak_p80 | float)
            - (pv_peak_kwh | float),
            0
          ] | max
        }}

      target_soc_0700: >
        {% set x =
          min_soc
          + (
              morning_deficit_kwh
              * safety_factor
              / battery_capacity_kwh
              * 100
            )
        %}
        {{ [[x, min_soc] | max, max_soc] | min | round(0) }}

      target_soc_peak: >
        {% set x =
          min_soc
          + (
              peak_deficit_kwh
              * safety_factor
              / battery_capacity_kwh
              * 100
            )
        %}
        {{ [[x, min_soc] | max, max_soc] | min | round(0) }}

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_target_soc_0700
    data:
      value: "{{ target_soc_0700 }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_target_soc_peak
    data:
      value: "{{ target_soc_peak }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_p80_morning_load
    data:
      value: "{{ morning_p80 | round(2) }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_p80_peak_load
    data:
      value: "{{ peak_p80 | round(2) }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_pv_morning_forecast
    data:
      value: "{{ pv_morning_kwh | round(2) }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.sofar_pv_peak_forecast
    data:
      value: "{{ pv_peak_kwh | round(2) }}"

  - action: number.set_value
    target:
      entity_id: number.inverter_battery_eod
    data:
      value: 20